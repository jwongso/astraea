[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astraea"
version = "0.1.0"
description = "Open-justice RAG framework - jurisdiction-specific legal Q&A over public court decisions"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "qdrant-client>=1.9",
    "sentence-transformers>=3.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "redis>=5.0",
    "cachetools>=5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
ingest = [
    "beautifulsoup4>=4.12",
    "pypdf>=4.0",
    "pytesseract>=0.3",
    "pillow>=10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "retrieval: Tier 1 - Qdrant only, no LLM required",
    "structural: Tier 2 - LLM required, non-semantic checks",
    "llm: Tier 3 - LLM required, semantic answer quality",
]
