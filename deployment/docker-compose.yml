# Astraea local development stack
#
# Prerequisites:
#   - A GGUF model file accessible on the host (set LLAMA_MODEL_PATH)
#   - Docker with Compose v2
#
# Usage:
#   LLAMA_MODEL_PATH=/path/to/model.gguf docker compose up
#
# Ports:
#   6333  - Qdrant
#   6379  - Redis
#   8080  - llama.cpp (OpenAI-compatible)
#   8001  - nz-tenancy app
#   8002  - nz-employment app

services:

  qdrant:
    image: qdrant/qdrant:v1.9.7
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

  llama:
    image: ghcr.io/ggerganov/llama.cpp:server
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ${LLAMA_MODEL_PATH:-/dev/null}:/model.gguf:ro
    command: >
      --model /model.gguf
      --host 0.0.0.0
      --port 8080
      --ctx-size 8192
      --n-gpu-layers 0
    profiles:
      - llm

  nz-tenancy:
    build:
      context: ..
      args:
        APP_MODULE: apps.nz_tenancy_app:app
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      LLM_BASE_URL: ${LLM_BASE_URL:-http://llama:8080/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3}
      PUBLIC_TOKEN: ${PUBLIC_TOKEN:-}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-*}
    depends_on:
      - qdrant
      - redis

  nz-employment:
    build:
      context: ..
      args:
        APP_MODULE: apps.nz_employment_app:app
    restart: unless-stopped
    ports:
      - "8002:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      LLM_BASE_URL: ${LLM_BASE_URL:-http://llama:8080/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3}
      PUBLIC_TOKEN: ${PUBLIC_TOKEN:-}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-*}
    depends_on:
      - qdrant
      - redis

volumes:
  qdrant_data:
